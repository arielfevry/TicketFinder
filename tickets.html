<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Tickets | TicketFinder</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/movies.css?v=20260926-1">
</head>

<body>

    <header>

        <!-- Nav Bar -->
        <a href="movies.html">
            TicketFinder
        </a>

        <nav>

            <a href="movies.html">
                Now Showing
            </a>

            <a
                href="tickets.html?v=20260925-3"
                aria-current="page"
            >
                My Tickets
            </a>

            <a
                href="admin.html"
                id="adminLink"
                hidden
            >
                Admin
            </a>

        </nav>


        <div>

            <span id="userName"></span>

            <button
                type="button"
                id="logoutBtn"
            >
                Sign Out
            </button>

        </div>

    </header>


    <main>

        <!-- Ticket Search Bar -->
        <h1>My Tickets</h1>


        <div>

            <label for="ticketSearch">
                Search your tickets
            </label>

            <input
                id="ticketSearch"
                type="search"
                placeholder="Search by movie title"
            >

        </div>


        <div id="ticketList"></div>

    </main>


    <div
        id="toasts"
        role="status"
        aria-live="polite"
    ></div>


    <script src="shared/shared.js"></script>
    <script src="js/tickets.js?v=20260928-1"></script>

</body>

</html>
