<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sign In | TicketFinder</title>

        <!-- Shared base styles (same as the other pages), then sign-in page styles -->
        <link rel="stylesheet" href="css/movies.css?v=20260925-3">
        <link rel="stylesheet" href="css/index.css?v=1">
    </head>

    <body>

        <!-- Header bar (brand only, since no one is signed in yet) -->
        <header>
            <a href="index.html">TicketFinder</a>
        </header>

        <main class="auth-main">

            <!-- LOGIN -->
            <section class="auth-card">
                <h1>Ticket<span>Finder</span></h1>
                <p class="auth-tagline">Grab your ticket before someone else does!</p>

                <!-- Login Form -->
                <form id="loginForm" class="auth-form">

                    <!-- Email Input -->
                    <label for="loginEmail">Email</label>
                    <input name="email" id="loginEmail" type="email" autocomplete="username" required>

                    <!-- Password Input -->
                    <label for="loginPassword">Password</label>
                    <input name="password" id="loginPassword" type="password" autocomplete="current-password" required>

                    <button type="submit">Sign in</button>
                    <p id="loginError" class="auth-message" role="alert" aria-live="polite"></p>
                </form>

                <p id="showRegisterLine" class="auth-switch">
                    <button type="button" id="showRegisterBtn" class="link-button">Need an account? Register</button>
                </p>

                <!-- Register Form -->
                <form id="registerForm" class="auth-form" hidden novalidate>
                    <!-- First Name -->
                    <label for="regFirstName">First Name</label>
                    <input id="regFirstName" name="firstName" autocomplete="given-name" required>

                    <!-- Last Name -->
                    <label for="regLastName">Last Name</label>
                    <input id="regLastName" name="lastName" autocomplete="family-name" required>

                    <!-- Email -->
                    <label for="regEmail">Email</label>
                    <input id="regEmail" name="email" type="email" autocomplete="email" required>

                    <!-- Password -->
                    <label for="regPassword">Password</label>
                    <input id="regPassword" name="password" type="password" autocomplete="new-password" required>

                    <!-- Confirm Password -->
                    <label for="regPasswordConfirm">Confirm Password</label>
                    <input id="regPasswordConfirm" type="password" autocomplete="new-password" required>

                    <button type="submit">Create Account</button>
                    <p id="registerError" class="auth-message" role="alert" aria-live="polite"></p>
                </form>

                <p id="showSignInLine" class="auth-switch" hidden>
                    <button type="button" id="showSignInBtn" class="link-button">Already have an account? Sign In</button>
                </p>
            </section>

        </main>

        <div id="toasts" role="status" aria-live="polite"></div>

        <script src="shared/shared.js"></script>
        <script src="js/index.js"></script>
    </body>
</html>
