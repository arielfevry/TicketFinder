<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Movie | TicketFinder</title>
</head>

<body>

    <h1>TicketFinder</h1>

    <!-- The selected movie will be inserted here by movie.js -->
    <div id="movie-details"></div>


    <h2>Showtimes</h2>

    <!-- Seat buttons will appear here after a showtime is selected -->

    <br>

    <a href="movies.html">
        Back to Movies
    </a>


    <!-- Load the JavaScript after the HTML elements exist -->
    <script src="js/movie.js"></script>

</body>

</html>
